<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>HRMS - Offline</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .offline-container {
      text-align: center;
      padding: 20px;
      max-width: 500px;
      animation: fadeIn 0.5s ease-in;
    }
    
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .offline-icon {
      width: 100px;
      height: 100px;
      margin: 0 auto 30px;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }
    
    h1 {
      color: white;
      font-size: 28px;
      margin-bottom: 10px;
    }
    
    p {
      color: rgba(255, 255, 255, 0.9);
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    
    .features {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 20px;
      margin: 20px 0;
      color: rgba(255, 255, 255, 0.9);
      font-size: 14px;
    }
    
    .features ul {
      list-style: none;
      text-align: left;
    }
    
    .features li {
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .features li:last-child {
      border-bottom: none;
    }
    
    .features li:before {
      content: "✓ ";
      margin-right: 10px;
      color: #4ade80;
    }
    
    .retry-btn {
      background: white;
      color: #1e40af;
      border: none;
      padding: 12px 30px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 20px;
    }
    
    .retry-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }
    
    .retry-btn:active {
      transform: translateY(0);
    }
    
    .status {
      margin-top: 30px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <svg class="offline-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="45" fill="none" stroke="white" stroke-width="2"/>
      <line x1="30" y1="30" x2="70" y2="70" stroke="white" stroke-width="3" stroke-linecap="round"/>
      <line x1="70" y1="30" x2="30" y2="70" stroke="white" stroke-width="3" stroke-linecap="round"/>
    </svg>
    
    <h1>You're Offline</h1>
    <p>But don't worry! The HRMS app is ready to work offline.</p>
    
    <div class="features">
      <ul>
        <li>View cached data and reports</li>
        <li>Browse employee information</li>
        <li>Check your dashboard</li>
        <li>Access offline documents</li>
      </ul>
    </div>
    
    <button class="retry-btn" onclick="retryConnection()">Try Again</button>
    
    <div class="status">
      <p>Connection will be restored automatically when you're back online.</p>
      <p id="timestamp"></p>
    </div>
  </div>
  
  <script>
    // Try to reconnect periodically
    function retryConnection() {
      fetch('/api/health', { method: 'HEAD' })
        .then(() => {
          window.location.reload();
        })
        .catch(() => {
          alert('Still offline. Please check your connection and try again.');
        });
    }
    
    // Show current time
    function updateTime() {
      const now = new Date();
      document.getElementById('timestamp').textContent = 'Last checked: ' + now.toLocaleTimeString();
    }
    
    updateTime();
    setInterval(updateTime, 1000);
    
    // Auto-retry every 5 seconds
    setInterval(() => {
      fetch('/api/health', { method: 'HEAD' })
        .then(() => {
          window.location.reload();
        })
        .catch(() => {
          // Still offline, keep waiting
        });
    }, 5000);
  </script>
</body>
</html>
